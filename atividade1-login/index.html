<!DOCTYPE html>

<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="caixa">

    <form>
            
        <img src="imagens/logo intelbras-Photoroom.png" alt="">

           <h1>Entrar Na Sua Conta</h1>
        
            

        <label for="email"><strong>E-mail ou Usuário</strong></label>    
               <input type="email" id="email" name="email" placeholder="digite seu e-mail ou usuário" required>
        
        <label for="senha"><strong>Senha</strong></label>
               <input type="password" id="senha" name="senha" placeholder="digite sua senha" required>
           

             <p class="esqueceuasenha">            
            <sub> <a href="#">Esqueceu a Senha?</a></sub></p> 
             
        
    
        <br>

        <button type="submit">Entrar</button>

        <p class="cadastrar"> <sub>não possui uma conta? <a href="#">cadastrar-se.</a></sub></p>

    </form>

</div>

</body>
</html>
